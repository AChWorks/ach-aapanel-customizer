<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f4f2eb">
  <title>خطای سرور | ACh</title>
  <style>:root{color-scheme:light;--paper:#f4f2eb;--ink:#0b1718;--muted:#4d6161;--accent:#008b92;--line:#ced8d1;--soft:#e6ede7;--white:#fff}
*,*::before,*::after{box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{margin:0;min-width:280px;min-height:100vh;min-height:100svh;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overflow-x:hidden}
body[dir="rtl"]{font-family:Vazirmatn,Tahoma,"Segoe UI",Arial,sans-serif}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(15,55,55,.024) 1px,transparent 1px),linear-gradient(90deg,rgba(15,55,55,.024) 1px,transparent 1px);background-size:40px 40px;mask-image:linear-gradient(to bottom,transparent 5%,#000 95%);z-index:0}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:3px solid var(--accent);outline-offset:5px;border-radius:3px}
.frame{position:relative;z-index:1;max-width:1240px;padding:clamp(24px,4.6vw,64px);min-height:100vh;min-height:100svh;margin:0 auto;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.brand{display:inline-flex;align-items:baseline;gap:14px;white-space:nowrap}
.brand-mark{direction:ltr;unicode-bidi:isolate;font-size:28px;letter-spacing:-.095em;line-height:1;font-weight:800}
.brand-mark::after{content:".";color:var(--accent)}
.brand-sub{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:10px;letter-spacing:.22em;font-weight:700;color:var(--muted)}
.header-status{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;letter-spacing:.11em;color:var(--muted);text-align:end}
.content{flex:1;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);align-items:center;gap:clamp(36px,7vw,100px);padding-block:clamp(64px,8vw,110px)}
.copy{max-width:660px}
.eyebrow{display:inline-flex;align-items:center;gap:12px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;letter-spacing:.14em;font-weight:700;color:#126b70;text-transform:uppercase}
.eyebrow::before{content:"";height:8px;width:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px #d9e9e2;flex:none}
.status{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:clamp(100px,15vw,202px);letter-spacing:-.115em;line-height:1;font-weight:750;margin:26px 0 20px;white-space:nowrap}
.status.word{font-size:clamp(57px,8vw,114px);letter-spacing:-.085em}
h1{font-size:clamp(30px,3.8vw,49px);line-height:1.12;letter-spacing:-.058em;font-weight:720;max-width:630px;margin:0 0 20px}
body[dir="rtl"] h1{letter-spacing:normal;line-height:1.45;font-weight:700}
body[dir="rtl"] .eyebrow{font-family:Vazirmatn,Tahoma,Arial,sans-serif;letter-spacing:normal;font-size:13px}
body[dir="rtl"] .button svg{transform:scaleX(-1)}
.description{color:var(--muted);font-size:clamp(16px,1.45vw,18px);line-height:1.85;max-width:520px;margin:0}
.actions{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin-top:40px}
.button{display:inline-flex;align-items:center;justify-content:center;gap:14px;min-height:52px;padding:14px 22px;background:var(--ink);border:1px solid var(--ink);border-radius:10px;color:#fff;font-size:14px;font-weight:650;transition:transform .14s ease,background .14s ease}
.button:hover{transform:translateY(-2px);background:#224044}
.button svg{width:16px;height:16px;flex:none}
.secondary{display:inline-flex;align-items:center;gap:8px;padding:10px 0;color:#235960;font-size:14px;font-weight:650;min-height:44px}
.secondary:hover{text-decoration:underline;text-underline-offset:4px}
.visual{position:relative;isolation:isolate;min-height:390px;border:1px solid #c8d5cf;background:linear-gradient(145deg,#ecf2eb 0%,#dce8df 100%);border-radius:20px;padding:26px;overflow:hidden;box-shadow:0 20px 70px rgba(11,23,24,.055)}
.visual::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent calc(50% - .5px),rgba(18,82,80,.13) 50%,transparent calc(50% + .5px)),linear-gradient(transparent calc(50% - .5px),rgba(18,82,80,.13) 50%,transparent calc(50% + .5px));pointer-events:none}
.visual-top,.visual-bottom{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:10px;letter-spacing:.08em;font-weight:700;color:#456663}
.visual-bottom{position:absolute;inset-inline:26px;bottom:25px;padding-top:18px;border-top:1px solid rgba(20,82,79,.15)}
.orbit{position:absolute;left:50%;top:50%;width:clamp(200px,28vw,325px);height:clamp(200px,28vw,325px);transform:translate(-50%,-50%);border:1px solid rgba(25,99,91,.27);border-radius:50%;z-index:1}
.orbit::before,.orbit::after{content:"";position:absolute;border:1px solid rgba(25,99,91,.2);border-radius:50%;inset:15%}
.orbit::after{inset:32%;background:rgba(255,255,255,.21)}
.orbit-mark{direction:ltr;unicode-bidi:isolate;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-weight:800;letter-spacing:-.09em;font-size:39px;color:#0b4143;z-index:2}
.orbit-mark::after{content:".";color:var(--accent)}
.orbit-dot{position:absolute;left:15%;top:14%;width:12px;height:12px;background:#008b92;border:3px solid #e0ede5;border-radius:50%;box-shadow:0 0 0 1px #2c8479}
.orbit-notch{position:absolute;right:-6px;top:49%;width:11px;height:11px;border-radius:3px;background:#18575a;transform:rotate(45deg)}
.bottom{display:flex;justify-content:space-between;align-items:center;gap:20px;border-top:1px solid var(--line);padding-top:22px;font-size:12px;color:var(--muted)}
.bottom a{color:#215e61;text-underline-offset:3px}
.bottom a:hover{text-decoration:underline}
body[dir="rtl"] .header-status,body[dir="rtl"] .visual-top,body[dir="rtl"] .visual-bottom{direction:ltr}
body[dir="rtl"] .status,body[dir="rtl"] .brand,body[dir="rtl"] .brand-sub{direction:ltr}
body[dir="rtl"] .copy{max-width:690px}
body[dir="rtl"] .status.word{font-size:clamp(57px,8vw,114px)}
@media(max-width:860px){.content{grid-template-columns:1fr;padding-block:60px 50px;gap:44px}.visual{min-height:230px;max-width:100%}.orbit{width:210px;height:210px}.status{font-size:clamp(108px,23vw,180px)}.status.word{font-size:clamp(62px,12vw,100px)}}
@media(max-width:520px){.frame{padding:22px 22px 26px}.brand-sub{font-size:8px;letter-spacing:.12em}.brand-mark{direction:ltr;unicode-bidi:isolate;font-size:26px}.header-status{font-size:9px;letter-spacing:.05em}.content{padding-block:52px 44px;gap:38px}.status{font-size:clamp(92px,25vw,130px);margin:25px 0 19px}.status.word{font-size:clamp(53px,11.8vw,75px)}h1{font-size:clamp(29px,8vw,38px)}.description{font-size:16px}.actions{margin-top:30px}.visual{min-height:210px;padding:20px;border-radius:15px}.orbit{width:185px;height:185px}.visual-bottom{inset-inline:20px;bottom:19px}.bottom{font-size:11px;align-items:flex-start;flex-wrap:wrap}.button{min-height:49px}}
@media(prefers-reduced-motion:reduce){.button{transition:none}.button:hover{transform:none}}</style>
</head>
<body dir="rtl" class="page-500">
  <div class="frame">
    <header class="top">
      <a class="brand" href="https://ach.li" aria-label="ACh website">
        <span class="brand-mark" dir="ltr">ACh</span>
        <span class="brand-sub">WEB SYSTEMS</span>
      </a>
      <span class="header-status">STATUS / 500</span>
    </header>
    <main class="content">
      <section class="copy" aria-labelledby="main-heading">
        <span class="eyebrow">خطای داخلی سرور</span>
        <div class="status " aria-hidden="true">500</div>
        <h1 id="main-heading">در پردازش درخواست مشکلی پیش آمد.</h1>
        <p class="description">وب‌سایت نتوانست این درخواست را پردازش کند. لطفاً دوباره تلاش کنید یا بعداً مراجعه کنید.</p>
        <nav class="actions" aria-label="گزینه‌های ادامه">
          <a class="button" href="">تلاش دوباره
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>
          <a class="secondary" href="https://ach.li">درباره ACh &nearr;</a>
        </nav>
      </section>
      <aside class="visual" aria-hidden="true">
        <div class="visual-top"><span>ACH / WEB SYSTEMS</span><span>LIVE / STATUS</span></div>
        <div class="orbit"><span class="orbit-mark" dir="ltr">ACh</span><span class="orbit-dot"></span><span class="orbit-notch"></span></div>
        <div class="visual-bottom"><span>SYSTEM / RESPONSE</span><span>500</span></div>
      </aside>
    </main>
    <footer class="bottom"><span>ACh / زیرساخت و تجربه وب</span><a href="https://ach.li">ach.li &nearr;</a></footer>
  </div>
</body>
</html>
